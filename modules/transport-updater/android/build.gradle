plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ke.navari.transport.updater'
version = '1.0.0'

android {
  namespace 'ke.navari.transport.updater'
  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
}
